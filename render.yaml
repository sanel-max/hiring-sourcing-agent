services:
  - type: web
    name: hiring-sourcing-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: scheduler-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_RESULTS_CHANNEL
        value: sourcing-search
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SCHEDULER_DB_PATH
        value: /var/data/scheduler.db
      - key: DAILY_COST_CAP_USD
        value: "10"
      - key: SCHEDULER_RUN_INTERVAL_HOURS
        value: "24"
