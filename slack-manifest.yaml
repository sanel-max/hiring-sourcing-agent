display_information:
  name: Sourcing Search
  description: Sources candidates for an open role across LinkedIn, X, and Instagram.
  background_color: "#2c2d30"

features:
  bot_user:
    display_name: sourcing-search
    always_online: true
  slash_commands:
    - command: /search
      url: https://hiring-sourcing-agent.onrender.com/slack/commands
      description: Source candidates for a role
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write

settings:
  interactivity:
    is_enabled: true
    request_url: https://hiring-sourcing-agent.onrender.com/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
