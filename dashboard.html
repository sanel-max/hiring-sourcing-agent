<title>Sourcing Criteria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f1f3ee;
    --surface: #ffffff;
    --surface-2: #e7ebe1;
    --ink: #182019;
    --ink-muted: #5c6b5e;
    --border: #d8ded2;
    --accent: #2f6f4f;
    --accent-soft: #e3ede6;
    --accent-ink: #ffffff;
    --warn: #b5762b;
    --warn-soft: #f4e9da;
    --danger: #b23b3b;
    --danger-soft: #f5e2e0;
    --shadow: 0 1px 2px rgba(24, 32, 25, 0.06), 0 8px 24px -12px rgba(24, 32, 25, 0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10140e;
      --surface: #171c14;
      --surface-2: #1e251a;
      --ink: #e7ece1;
      --ink-muted: #93a38f;
      --border: #2a3324;
      --accent: #5cbf8e;
      --accent-soft: #1e2c22;
      --accent-ink: #0d1710;
      --warn: #e2a855;
      --warn-soft: #2c2416;
      --danger: #e27272;
      --danger-soft: #2c1a19;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #10140e;
    --surface: #171c14;
    --surface-2: #1e251a;
    --ink: #e7ece1;
    --ink-muted: #93a38f;
    --border: #2a3324;
    --accent: #5cbf8e;
    --accent-soft: #1e2c22;
    --accent-ink: #0d1710;
    --warn: #e2a855;
    --warn-soft: #2c2416;
    --danger: #e27272;
    --danger-soft: #2c1a19;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr;
    min-height: 100vh;
  }

  /* ---------- sidebar ---------- */
  .rail {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .rail-head {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
  }

  .rail-head .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .rail-head h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 4px 0 0;
    text-wrap: balance;
  }

  .role-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .role-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
  }

  .role-item:hover { background: var(--surface-2); }

  .role-item.active {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .role-item .name {
    font-weight: 500;
    font-size: 13.5px;
  }

  .role-item .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--ink-muted);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .role-item.archived .status-dot { background: var(--ink-muted); }
  .role-item.archived .name { color: var(--ink-muted); }

  .rail-empty {
    padding: 24px 16px;
    color: var(--ink-muted);
    font-size: 13px;
  }

  .rail-foot {
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  .btn-new {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--ink-muted);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .btn-new:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; }

  .main-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    text-align: center;
    padding: 40px;
  }

  .main-empty p { max-width: 340px; text-wrap: balance; }

  .dossier { max-width: 760px; width: 100%; margin: 0 auto; padding: 36px 40px 80px; }

  .dossier-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
  }

  .name-field {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    border: none;
    background: none;
    color: var(--ink);
    width: 100%;
    padding: 2px 0;
    text-wrap: balance;
  }
  .name-field:focus { outline: none; border-bottom: 1px solid var(--accent); }

  .top-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-top: 6px; }

  .save-indicator {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--ink-muted);
    min-width: 64px;
    text-align: right;
  }
  .save-indicator.saving { color: var(--warn); }
  .save-indicator.saved { color: var(--accent); }

  .status-toggle {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    cursor: pointer;
  }
  .status-toggle.is-active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }

  .field { margin-bottom: 22px; }
  .field label, .subfield label {
    display: block;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 7px;
  }

  .field .hint { font-size: 11.5px; color: var(--ink-muted); margin-top: 5px; font-family: 'IBM Plex Sans', sans-serif; text-transform: none; letter-spacing: 0; }

  input[type=text], textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    resize: vertical;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }

  textarea.lg { min-height: 96px; }

  .platforms { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11.5px;
    cursor: pointer;
    user-select: none;
  }
  .chip input { accent-color: var(--accent); }
  .chip.checked { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .section-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 36px 0 4px;
    padding-top: 22px;
    border-top: 1px solid var(--border);
  }
  .section-sub { color: var(--ink-muted); font-size: 12px; margin-bottom: 16px; }

  .examples-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .example-box label {
    display: flex; align-items: center; gap: 6px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 7px;
  }
  .dot-good { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .dot-bad { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }

  .filters-list { display: flex; flex-direction: column; gap: 10px; }

  .filter-row {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: var(--surface);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: start;
  }

  .filter-row .fields { display: flex; flex-direction: column; gap: 8px; }

  .filter-row input[type=text] { font-weight: 500; }
  .filter-row textarea { min-height: 44px; font-size: 12.5px; }

  .remove-filter {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-muted);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .remove-filter:hover { border-color: var(--danger); color: var(--danger); }

  .btn-add-filter {
    align-self: flex-start;
    margin-top: 4px;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px dashed var(--border);
    background: none;
    color: var(--ink-muted);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11.5px;
    cursor: pointer;
  }
  .btn-add-filter:hover { border-color: var(--accent); color: var(--accent); }

  .filters-empty {
    color: var(--ink-muted);
    font-size: 12.5px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
  }

  .danger-zone { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--border); }
  .btn-delete {
    background: none;
    border: 1px solid var(--danger-soft);
    color: var(--danger);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .btn-delete:hover { background: var(--danger-soft); }

  ::selection { background: var(--accent-soft); }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .rail { max-height: 240px; }
    .field-row, .examples-grid { grid-template-columns: 1fr; }
    .dossier { padding: 24px 20px 60px; }
  }
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="eyebrow">sourcing-search</div>
      <h1>Role criteria</h1>
    </div>
    <div class="role-list" id="roleList">
      <div class="rail-empty">Loading roles…</div>
    </div>
    <div class="rail-foot">
      <button class="btn-new" id="newRoleBtn">+ New role</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-empty">
      <p>Select a role on the left, or add a new one. Everything you fill in here — the job description, examples, and binary filters — is what <code>/search</code> uses to source and score candidates for that role.</p>
    </div>
  </main>
</div>

<script>
(function () {
  const PLATFORMS = [
    { id: 'linkedin', label: 'LinkedIn' },
    { id: 'twitter', label: 'X / Twitter' },
    { id: 'instagram', label: 'Instagram' },
  ];

  let db = null;
  let roles = [];           // [{id, name, status}] for the sidebar, kept live
  let selectedId = null;
  let selectedDoc = null;   // full loaded document for the open role
  let saveTimer = null;
  let focusedField = null;  // name of field currently being typed into, to avoid re-render stomp

  const roleListEl = document.getElementById('roleList');
  const mainEl = document.getElementById('main');
  const newRoleBtn = document.getElementById('newRoleBtn');

  function slugify(name) {
    return name.toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 48) || 'role';
  }

  async function uniqueSlug(base) {
    let slug = base, n = 2;
    const existing = new Set(roles.map(r => r.id));
    while (existing.has(slug)) { slug = `${base}-${n++}`; }
    return slug;
  }

  function renderRoleList() {
    if (!roles.length) {
      roleListEl.innerHTML = '<div class="rail-empty">No roles yet — add one to start sourcing.</div>';
      return;
    }
    roleListEl.innerHTML = '';
    roles.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'role-item' + (r.id === selectedId ? ' active' : '') + (r.status === 'archived' ? ' archived' : '');
      btn.innerHTML = `<span class="name"></span><span class="meta"><span class="status-dot"></span><span class="statustext"></span></span>`;
      btn.querySelector('.name').textContent = r.name || '(untitled role)';
      btn.querySelector('.statustext').textContent = r.status === 'archived' ? 'archived' : 'active';
      btn.addEventListener('click', () => selectRole(r.id));
      roleListEl.appendChild(btn);
    });
  }

  function defaultDoc(name) {
    const now = new Date().toISOString();
    return {
      name, status: 'active', location: '', platforms: ['linkedin', 'twitter', 'instagram'],
      keywords: [], job_description: '', good_examples: '', bad_examples: '',
      binary_filters: [], created_at: now, updated_at: now,
    };
  }

  async function selectRole(id) {
    selectedId = id;
    renderRoleList();
    const snap = await db.collection('roles').doc(id).get();
    selectedDoc = snap.exists ? snap.data() : defaultDoc(id);
    renderDossier();
  }

  function scheduleSave() {
    const indicator = document.getElementById('saveIndicator');
    if (indicator) { indicator.textContent = 'saving…'; indicator.className = 'save-indicator saving'; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
  }

  async function doSave() {
    if (!selectedId || !selectedDoc) return;
    selectedDoc.updated_at = new Date().toISOString();
    await db.collection('roles').doc(selectedId).set(selectedDoc);
    const indicator = document.getElementById('saveIndicator');
    if (indicator) { indicator.textContent = 'saved'; indicator.className = 'save-indicator saved'; }
  }

  function renderDossier() {
    if (!selectedDoc) { mainEl.innerHTML = ''; return; }
    const d = selectedDoc;
    mainEl.innerHTML = `
      <div class="dossier">
        <div class="dossier-top">
          <input class="name-field" id="nameField" type="text" value="" placeholder="Role name" />
          <div class="top-actions">
            <span class="save-indicator" id="saveIndicator"></span>
            <button class="status-toggle" id="statusToggle"></button>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Location</label>
            <input type="text" id="locationField" placeholder="e.g. Remote (US), or a city" />
          </div>
          <div class="field">
            <label>Search keywords</label>
            <input type="text" id="keywordsField" placeholder="comma-separated, e.g. Senior Backend Engineer, Platform Engineer" />
          </div>
        </div>

        <div class="field">
          <label>Source from</label>
          <div class="platforms" id="platformsField"></div>
        </div>

        <div class="field">
          <label>Job description</label>
          <textarea id="jdField" class="lg" placeholder="Paste or write the job description. This is the main thing candidates get scored against."></textarea>
        </div>

        <div class="section-title">Examples</div>
        <div class="section-sub">Free text — describe what a strong fit looks like, and what to avoid. Visual (a portfolio, a look) or written, whatever's useful.</div>
        <div class="examples-grid">
          <div class="example-box">
            <label><span class="dot-good"></span> Good examples</label>
            <textarea id="goodField" class="lg" placeholder="What does a great candidate for this role look like?"></textarea>
          </div>
          <div class="example-box">
            <label><span class="dot-bad"></span> Bad examples / red flags</label>
            <textarea id="badField" class="lg" placeholder="What should disqualify or lower confidence in a candidate?"></textarea>
          </div>
        </div>

        <div class="section-title">Binary filters</div>
        <div class="section-sub">Yes/no checks scored against each candidate's public profile, e.g. "worked as a backend engineer for 12+ months."</div>
        <div class="filters-list" id="filtersList"></div>
        <button class="btn-add-filter" id="addFilterBtn">+ Add filter</button>

        <div class="danger-zone">
          <button class="btn-delete" id="deleteBtn">Delete this role permanently</button>
        </div>
      </div>
    `;

    document.getElementById('nameField').value = d.name || '';
    document.getElementById('locationField').value = d.location || '';
    document.getElementById('keywordsField').value = (d.keywords || []).join(', ');
    document.getElementById('jdField').value = d.job_description || '';
    document.getElementById('goodField').value = d.good_examples || '';
    document.getElementById('badField').value = d.bad_examples || '';

    const statusBtn = document.getElementById('statusToggle');
    function paintStatus() {
      statusBtn.textContent = d.status === 'archived' ? 'archived' : 'active';
      statusBtn.className = 'status-toggle' + (d.status !== 'archived' ? ' is-active' : '');
    }
    paintStatus();
    statusBtn.addEventListener('click', () => {
      d.status = d.status === 'archived' ? 'active' : 'archived';
      paintStatus();
      const r = roles.find(x => x.id === selectedId);
      if (r) r.status = d.status;
      renderRoleList();
      scheduleSave();
    });

    const platformsField = document.getElementById('platformsField');
    PLATFORMS.forEach(p => {
      const chip = document.createElement('label');
      const checked = (d.platforms || []).includes(p.id);
      chip.className = 'chip' + (checked ? ' checked' : '');
      chip.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''}/> ${p.label}`;
      const cb = chip.querySelector('input');
      cb.addEventListener('change', () => {
        const set = new Set(d.platforms || []);
        if (cb.checked) set.add(p.id); else set.delete(p.id);
        d.platforms = Array.from(set);
        chip.classList.toggle('checked', cb.checked);
        scheduleSave();
      });
      platformsField.appendChild(chip);
    });

    bindText('nameField', v => { d.name = v; const r = roles.find(x => x.id === selectedId); if (r) r.name = v; renderRoleListPreserveScroll(); });
    bindText('locationField', v => { d.location = v; });
    bindText('keywordsField', v => { d.keywords = v.split(',').map(s => s.trim()).filter(Boolean); });
    bindText('jdField', v => { d.job_description = v; });
    bindText('goodField', v => { d.good_examples = v; });
    bindText('badField', v => { d.bad_examples = v; });

    renderFilters();
    document.getElementById('addFilterBtn').addEventListener('click', () => {
      d.binary_filters = d.binary_filters || [];
      d.binary_filters.push({ label: '', description: '' });
      renderFilters();
      scheduleSave();
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm(`Delete "${d.name || selectedId}" permanently? This can't be undone.`)) return;
      await db.collection('roles').doc(selectedId).delete();
      selectedId = null;
      selectedDoc = null;
      mainEl.innerHTML = '<div class="main-empty"><p>Role deleted.</p></div>';
    });
  }

  function bindText(id, onChange) {
    const el = document.getElementById(id);
    el.addEventListener('focus', () => { focusedField = id; });
    el.addEventListener('blur', () => { focusedField = null; });
    el.addEventListener('input', () => { onChange(el.value); scheduleSave(); });
  }

  function renderRoleListPreserveScroll() {
    const scrollTop = roleListEl.scrollTop;
    renderRoleList();
    roleListEl.scrollTop = scrollTop;
  }

  function renderFilters() {
    const list = document.getElementById('filtersList');
    const filters = selectedDoc.binary_filters || [];
    if (!filters.length) {
      list.innerHTML = '<div class="filters-empty">No binary filters yet. These are optional — add one if there\'s a hard yes/no requirement.</div>';
      return;
    }
    list.innerHTML = '';
    filters.forEach((f, i) => {
      const row = document.createElement('div');
      row.className = 'filter-row';
      row.innerHTML = `
        <div class="fields">
          <input type="text" placeholder="e.g. Worked as a backend engineer for 12+ months" />
          <textarea placeholder="Extra context the model should use to judge this"></textarea>
        </div>
        <button class="remove-filter" title="Remove">×</button>
      `;
      const labelInput = row.querySelector('input');
      const descInput = row.querySelector('textarea');
      labelInput.value = f.label || '';
      descInput.value = f.description || '';
      labelInput.addEventListener('input', () => { f.label = labelInput.value; scheduleSave(); });
      descInput.addEventListener('input', () => { f.description = descInput.value; scheduleSave(); });
      row.querySelector('.remove-filter').addEventListener('click', () => {
        filters.splice(i, 1);
        renderFilters();
        scheduleSave();
      });
      list.appendChild(row);
    });
  }

  newRoleBtn.addEventListener('click', async () => {
    const name = prompt('Role name (e.g. "Senior Backend Engineer")');
    if (!name || !name.trim()) return;
    const id = await uniqueSlug(slugify(name));
    const doc = defaultDoc(name.trim());
    await db.collection('roles').doc(id).set(doc);
    selectedId = id;
    selectedDoc = doc;
    renderDossier();
  });

  async function init() {
    db = await claude.use('db');
    if (!db) {
      roleListEl.innerHTML = '<div class="rail-empty">Database unavailable in this view.</div>';
      return;
    }
    db.collection('roles').orderBy('name').onSnapshot(snap => {
      roles = snap.docs.map(doc => {
        const data = doc.data() || {};
        return { id: doc.id, name: data.name || doc.id, status: data.status || 'active' };
      });
      if (focusedField === null) renderRoleList();
    }, err => {
      roleListEl.innerHTML = `<div class="rail-empty">${err.message}</div>`;
    });
  }

  init();
})();
</script>
